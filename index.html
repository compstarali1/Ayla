<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sweetheart — Forever Yours</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Overlay for readability */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26, 0, 42, 0.75), rgba(58, 9, 80, 0.65));
            z-index: 0;
        }

        /* Main Content Container */
        .content {
            text-align: center;
            padding: 60px 40px;
            max-width: 900px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 200, 255, 0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.6rem;
            margin-bottom: 60px;
            color: #ffd6f5;
            font-style: italic;
            line-height: 1.8;
        }

        /* Buttons Container — Right Side Center */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 40px;
            margin-right: 80px;
            margin-bottom: 80px;
        }

        /* 3D Animated Button Style */
        .audio-btn {
            font-size: 2rem;
            font-weight: bold;
            padding: 25px 60px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 0 #7a1fa2,
                0 15px 25px rgba(0, 0, 0, 0.4),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                inset 0 3px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(145deg, #b82fdd, #8e24aa);
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            min-width: 320px;
        }

        .audio-btn:hover {
            transform: translateY(-5px) rotateX(5deg);
            box-shadow: 
                0 15px 0 #7a1fa2,
                0 20px 35px rgba(0, 0, 0, 0.5),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                inset 0 3px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(145deg, #c94aeb, #9c27b0);
        }

        .audio-btn:active {
            transform: translateY(8px);
            box-shadow: 
                0 5px 0 #7a1fa2,
                0 8px 15px rgba(0, 0, 0, 0.4),
                inset 0 -3px 0 rgba(0, 0, 0, 0.2),
                inset 0 3px 0 rgba(255, 255, 255, 0.2);
            background: linear-gradient(145deg, #9c27b0, #7b1fa2);
        }

        /* Audio Player Section — Full Width */
        .audio-player-container {
            width: 100%;
            max-width: 900px;
            margin-top: 40px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .player-label {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #ffd6f5;
        }

        /* Progress Bar — Full Width Impressive */
        .progress-container {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e91e63, #9c27b0, #673ab7);
            border-radius: 8px;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px rgba(156, 39, 176, 0.6);
        }

        /* Time Display */
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            color: #e0c4f5;
            margin-bottom: 20px;
        }

        /* Control Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
        }

        .control-btn {
            font-size: 1.8rem;
            padding: 12px 30px;
            border-radius: 12px;
            background: linear-gradient(145deg, #5a189a, #3c096c);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 0 #2f0854, 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #2f0854, 0 14px 25px rgba(0, 0, 0, 0.4);
        }

        .control-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2f0854, 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            width: 120px;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e91e63;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.6);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
            .button-container { align-items: center; margin-right: 0; }
            .audio-btn { font-size: 1.5rem; padding: 20px 40px; min-width: 260px; }
            .controls { gap: 15px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- Background Image -- bg.jpg -->
    <div class="overlay"></div>

    <!-- Main Content -->
    <div class="content">
        <h1>❤️ My Sweetheart Alya ❤️</h1>

        <!-- Right-Side Buttons -->
        <div class="button-container">
            <button class="audio-btn" onclick="playAudio('a.mp3')">🎵 My Perfect Man</button>
            <button class="audio-btn" onclick="playAudio('b.mp3')">🎵 The Beginnings</button>
        </div>

        <!-- Audio Player -- Full Width -->
        <div class="audio-player-container">
            <p class="player-label">🎶 Now Playing</p>
            
            <!-- Progress Bar -->
            <div class="progress-container" id="progressBar" onclick="seekAudio(event)">
                <div class="progress-bar" id="progressFill"></div>
            </div>

            <!-- Time Display -->
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="control-btn" onclick="skipBack()">⏮</button>
                <button class="control-btn" onclick="togglePlayPause()" id="playPauseBtn">▶</button>
                <button class="control-btn" onclick="skipForward()">⏭</button>
                <div class="volume-control">
                    <span>🔊</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="1" onchange="setVolume(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audioPlayer">
        Your browser does not support the audio element.
    

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const playPauseBtn = document.getElementById('playPauseBtn');
        let currentAudioSrc = '';

        // Play selected audio file
        function playAudio(src) {
            audioPlayer.src = src;
            currentAudioSrc = src;
            audioPlayer.play().catch(e => console.log('Playback prevented:', e));
        }

        // Toggle Play/Pause
        function togglePlayPause() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        // Skip back 10s
        function skipBack() {
            audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10);
        }

        // Skip forward 10s
        function skipForward() {
            audioPlayer.currentTime = Math.min(audioPlayer.duration, audioPlayer.currentTime + 10);
        }

        // Set volume
        function setVolume(value) {
            audioPlayer.volume = value;
        }

        // Seek from progress bar click
        function seekAudio(event) {
            const progressBar = document.getElementById('progressBar');
            const clickX = event.offsetX;
            const width = progressBar.offsetWidth;
            const seekTime = (clickX / width) * audioPlayer.duration;
            audioPlayer.currentTime = seekTime;
        }

        // Format time to MM:SS
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Update progress bar and time display
        audioPlayer.addEventListener('timeupdate', () => {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        });

        // Load duration when metadata is ready
        audioPlayer.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audioPlayer.duration);
        });

        // Update play/pause button icon
        audioPlayer.addEventListener('play', () => {
            playPauseBtn.textContent = '⏸';
        });
        audioPlayer.addEventListener('pause', () => {
            playPauseBtn.textContent = '▶';
        });

        // Reset progress when audio ends
        audioPlayer.addEventListener('ended', () => {
            progressFill.style.width = '0%';
            playPauseBtn.textContent = '▶';
        });
    </script>

</body>
</html>
